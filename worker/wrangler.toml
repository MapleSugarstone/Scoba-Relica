name = "scoba-relica-relay"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed durable objects are the ones available on the Workers free
# plan, so the relay costs nothing until the game is genuinely busy.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
