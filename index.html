<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f0e8d8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Relica" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <title>Scoba Relica</title>
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/menus.css" />
  <link rel="stylesheet" href="/src/styles/battle.css" />
</head>
<body>
  <div id="frame">
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="hud">
      <div id="bag">
        <button id="bagBtn" aria-label="Menu" aria-expanded="false" aria-controls="bagMenu">
          <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
            <rect x="5" y="2" width="2" height="3"/><rect x="9" y="2" width="2" height="3"/>
            <rect x="6" y="1" width="4" height="2"/>
            <rect x="2" y="5" width="12" height="2"/>
            <rect x="2" y="7" width="2" height="7"/><rect x="12" y="7" width="2" height="7"/>
            <rect x="2" y="12" width="12" height="2"/>
            <rect x="7" y="8" width="2" height="3"/>
          </svg>
        </button>
        <div id="bagMenu" hidden></div>
      </div>
      <button id="actBtn">A</button>
      <div id="stick"><div id="stickKnob"></div></div>
      <div id="dialog"></div>
    </div>
    <div id="toast"></div>
  </div>
  <div id="fade" class="on busy"></div>
  </div>
  <div id="rotate" aria-live="polite">
    <svg viewBox="0 0 24 24" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="3" y="7" width="18" height="10" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="18" y="10" width="2" height="4"/>
      <rect x="9" y="2" width="6" height="2"/><rect x="15" y="3" width="2" height="2"/>
      <rect x="9" y="20" width="6" height="2"/><rect x="7" y="19" width="2" height="2"/>
    </svg>
    <strong>Turn it sideways</strong>
    <span>Scoba Relica plays with the screen held wide.</span>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
